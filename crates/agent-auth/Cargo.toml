[package]
name = "agent-auth"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Detect authentication status for AI coding agents (Claude Code, Codex CLI)"

[[bin]]
name = "agent-auth"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "rt", "macros"] }
